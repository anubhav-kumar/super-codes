# Frontend hosting: private S3 bucket + CloudFront (OAC, SPA rewrite, security headers).
# frontend-architecture.md section 7. Declares no functions.
service: ca-crm-frontend

frameworkVersion: '3'

provider:
  name: aws
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'ap-southeast-1'}
  deploymentMethod: direct

resources:
  Resources:
    SiteBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Delete
      UpdateReplacePolicy: Delete
      Properties:
        # Name generated by CloudFormation (prefixed with the stack name) to avoid global collisions.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    SiteOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-oac
          Description: OAC for ${self:service}-${sls:stage}
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Rewrite extensionless paths to /index.html (SPA routing)
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
              var request = event.request;
              if (!request.uri.includes('.')) {
                  request.uri = '/index.html';
              }
              return request;
          }

    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${sls:stage}-security-headers
          Comment: Security headers for ${self:service}-${sls:stage}
          SecurityHeadersConfig:
            StrictTransportSecurity:
              AccessControlMaxAgeSec: 63072000
              IncludeSubdomains: true
              Override: true
            ContentTypeOptions:
              Override: true
            ReferrerPolicy:
              ReferrerPolicy: strict-origin-when-cross-origin
              Override: true
            FrameOptions:
              FrameOption: DENY
              Override: true

    SiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Comment: ${self:service}-${sls:stage}
          Enabled: true
          DefaultRootObject: index.html
          HttpVersion: http2and3
          IPV6Enabled: true
          PriceClass: PriceClass_200
          Origins:
            - Id: SiteBucketOrigin
              DomainName: { 'Fn::GetAtt': [SiteBucket, RegionalDomainName] }
              OriginAccessControlId: { 'Fn::GetAtt': [SiteOriginAccessControl, Id] }
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            TargetOriginId: SiteBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed policy "CachingOptimized": honours the Cache-Control set on each object.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: { Ref: SecurityHeadersPolicy }
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: { 'Fn::GetAtt': [SpaRewriteFunction, FunctionARN] }

    SiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: { Ref: SiteBucket }
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontReadViaOAC
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource:
                'Fn::Join': ['', [{ 'Fn::GetAtt': [SiteBucket, Arn] }, '/*']]
              Condition:
                StringEquals:
                  'AWS:SourceArn':
                    'Fn::Join':
                      - ''
                      - ['arn:aws:cloudfront::', { Ref: 'AWS::AccountId' }, ':distribution/', { Ref: SiteDistribution }]

  Outputs:
    BucketName:
      Value: { Ref: SiteBucket }
    DistributionId:
      Value: { Ref: SiteDistribution }
    DistributionDomainName:
      Value: { 'Fn::GetAtt': [SiteDistribution, DomainName] }
    SiteUrl:
      Value:
        'Fn::Join': ['', ['https://', { 'Fn::GetAtt': [SiteDistribution, DomainName] }]]
