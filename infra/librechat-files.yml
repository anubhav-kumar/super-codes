AWSTemplateFormatVersion: '2010-09-09'
Description: LibreChat file storage - one private S3 bucket for all uploaded files.

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:3080
    Description: Origin of the LibreChat web app. The browser fetches presigned S3 URLs from it (image download).

Resources:
  FilesBucket:
    Type: AWS::S3::Bucket
    # undeploy.py empties the bucket first, then the stack deletes it.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'librechat-files-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # LibreChat uploads large files in parts; clean up parts of uploads that never finished.
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub '${FilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BucketName:
    Description: Value for AWS_BUCKET_NAME in .env
    Value: !Ref FilesBucket
  Region:
    Description: Value for AWS_REGION in .env
    Value: !Ref AWS::Region
