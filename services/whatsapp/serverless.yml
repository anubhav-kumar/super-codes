# Vartalap AWS side: DynamoDB tables, outbound SQS FIFO + DLQ, webhook and sender Lambdas.
# Deploy: npx serverless deploy --stage <stage>   (see README.md)
frameworkVersion: '4'

service: vartalap

params:
  default:
    # Graph API version used by the WhatsApp Cloud API client (M6).
    waGraphVersion: v26.0
    # Sender timeout drives the queue visibility timeout (>= 6x, per AWS guidance).
    senderTimeout: 30
    outboundVisibilityTimeout: 180

build:
  esbuild:
    bundle: true
    minify: false
    format: esm
    outExtension:
      '.js': '.mjs'
    sourcemap:
      type: linked
      setNodeOptions: true
    # Adds a createRequire banner so CommonJS deps (the AWS SDK) work inside the ESM bundle.
    configFile: ./esbuild.config.cjs
    # @vartalap/core and its dependencies, including the AWS SDK it imports from the workspace,
    # are bundled into each function.

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 256
  logRetentionInDays: 14
  environment:
    STAGE: ${sls:stage}
    # AWS_REGION is set by the Lambda runtime itself (reserved variable).
    MESSAGES_TABLE: !Ref MessagesTable
    CHATS_TABLE: !Ref ChatsTable
    USERS_TABLE: !Ref UsersTable
    OUTBOUND_QUEUE_URL: !Ref OutboundQueue
    # WhatsApp settings live in SSM parameters created by this stack (resources below).
    # Functions get only the parameter *names* they need and read the values at runtime
    # (src/lib/params.js), so values are never baked into the deployment.
  iam:
    role:
      # Each function gets its own role with only the statements below.
      mode: perFunction

functions:
  webhook:
    handler: src/handlers/webhook.handler
    environment:
      WA_PHONE_NUMBER_ID_PARAM: !Ref WaPhoneNumberIdParam
      WA_APP_SECRET_PARAM: !Ref WaAppSecretParam
      WA_VERIFY_TOKEN_PARAM: !Ref WaVerifyTokenParam
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /webhook
      - httpApi:
          method: POST
          path: /webhook
    iam:
      inheritStatements: false
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:ConditionCheckItem
              - dynamodb:Query
            Resource:
              - !GetAtt MessagesTable.Arn
              # Fn::Join, not !Sub: Serverless would try to resolve ${...} itself.
              - !Join ['', [!GetAtt MessagesTable.Arn, '/index/byWaMessageId']]
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt ChatsTable.Arn
          - Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':ssm:'
                  - !Ref AWS::Region
                  - ':'
                  - !Ref AWS::AccountId
                  - ':parameter'
                  - !Ref WaPhoneNumberIdParam
              - !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':ssm:'
                  - !Ref AWS::Region
                  - ':'
                  - !Ref AWS::AccountId
                  - ':parameter'
                  - !Ref WaAppSecretParam
              - !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':ssm:'
                  - !Ref AWS::Region
                  - ':'
                  - !Ref AWS::AccountId
                  - ':parameter'
                  - !Ref WaVerifyTokenParam

  sender:
    handler: src/handlers/sender.handler
    environment:
      WA_GRAPH_VERSION: ${param:waGraphVersion}
      WA_PHONE_NUMBER_ID_PARAM: !Ref WaPhoneNumberIdParam
      WA_ACCESS_TOKEN_PARAM: !Ref WaAccessTokenParam
    timeout: ${param:senderTimeout}
    events:
      - sqs:
          arn: !GetAtt OutboundQueue.Arn
          batchSize: 1
    iam:
      inheritStatements: false
      role:
        # SQS receive/delete permissions for the event source are added automatically.
        statements:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt MessagesTable.Arn
          - Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':ssm:'
                  - !Ref AWS::Region
                  - ':'
                  - !Ref AWS::AccountId
                  - ':parameter'
                  - !Ref WaPhoneNumberIdParam
              - !Join
                - ''
                - - 'arn:'
                  - !Ref AWS::Partition
                  - ':ssm:'
                  - !Ref AWS::Region
                  - ':'
                  - !Ref AWS::AccountId
                  - ':parameter'
                  - !Ref WaAccessTokenParam

resources:
  Resources:
    # WhatsApp settings. CloudFormation can only create String (not SecureString) parameters.
    # Created with a placeholder; set real values once with `aws ssm put-parameter --overwrite`
    # (see README). Later deploys leave them alone unless these definitions change.
    WaPhoneNumberIdParam:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /vartalap/${sls:stage}/WA_PHONE_NUMBER_ID
        Type: String
        Value: CHANGE_ME
        Description: WhatsApp Cloud API phone number ID

    WaAccessTokenParam:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /vartalap/${sls:stage}/WA_ACCESS_TOKEN
        Type: String
        Value: CHANGE_ME
        Description: WhatsApp Cloud API access token

    WaAppSecretParam:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /vartalap/${sls:stage}/WA_APP_SECRET
        Type: String
        Value: CHANGE_ME
        Description: Meta app secret, used to check webhook signatures

    WaVerifyTokenParam:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /vartalap/${sls:stage}/WA_VERIFY_TOKEN
        Type: String
        Value: CHANGE_ME
        Description: Webhook verify token, also entered in the Meta webhook setup

    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vartalap-${sls:stage}-messages
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: messageId
            AttributeType: S
          - AttributeName: waMessageId
            AttributeType: S
        KeySchema:
          - AttributeName: messageId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byWaMessageId
            KeySchema:
              - AttributeName: waMessageId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ChatsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vartalap-${sls:stage}-chats
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: chatId
            AttributeType: S
          - AttributeName: assignedTo
            AttributeType: S
          - AttributeName: lastMessageAt
            AttributeType: S
        KeySchema:
          - AttributeName: chatId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byAssignee
            KeySchema:
              - AttributeName: assignedTo
                KeyType: HASH
              - AttributeName: lastMessageAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vartalap-${sls:stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byEmail
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    OutboundDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: vartalap-${sls:stage}-outbound-dlq.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        MessageRetentionPeriod: 1209600

    OutboundQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: vartalap-${sls:stage}-outbound.fifo
        FifoQueue: true
        # The producer always sets MessageDeduplicationId = messageId.
        ContentBasedDeduplication: false
        VisibilityTimeout: ${param:outboundVisibilityTimeout}
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt OutboundDlq.Arn
          maxReceiveCount: 3

  Outputs:
    MessagesTableName:
      Value: !Ref MessagesTable
    ChatsTableName:
      Value: !Ref ChatsTable
    UsersTableName:
      Value: !Ref UsersTable
    OutboundQueueUrl:
      Value: !Ref OutboundQueue
    OutboundDlqUrl:
      Value: !Ref OutboundDlq
    WaParameterNames:
      Description: SSM parameters to set with real values after the first deploy.
      Value: !Join
        - ', '
        - - !Ref WaPhoneNumberIdParam
          - !Ref WaAccessTokenParam
          - !Ref WaAppSecretParam
          - !Ref WaVerifyTokenParam
    WebhookUrl:
      Description: Register this as the callback URL in the Meta app.
      Value: !Join
        - ''
        - - 'https://'
          - !Ref HttpApi
          - '.execute-api.'
          - !Ref AWS::Region
          - '.'
          - !Ref AWS::URLSuffix
          - '/webhook'
