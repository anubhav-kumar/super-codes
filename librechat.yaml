# LibreChat configuration: OpenRouter models, S3 file storage, Agents, Projects, MCP and schedules.
# Reference: librechat.example.yaml and https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.18

cache: true

# Phase 1.5: uploaded files go to the S3 bucket from infra/ (AWS_REGION and AWS_BUCKET_NAME in .env).
fileStrategy: 's3'

# Phase 3: MCP server management in the UI, the pinned MCP picker, and scheduled agents.
# Scheduling also needs SCHEDULES_SINGLE_PROCESS=true in .env (one process, no Redis).
interface:
  defaultPinnedTools: ['mcp']
  mcpServers:
    use: true
    create: true
  schedules:
    use: true
    create: true

# Phase 3: local HTTP MCP servers are blocked unless their host:port is listed here
# (e.g. 'localhost:3333'). Restart LibreChat after changing it. Public HTTPS servers need no entry.
mcpSettings:
  allowedAddresses: []

endpoints:
  # Phase 3: agents use OpenRouter only, with capabilities that need no extra keys or Redis.
  agents:
    allowedProviders: ['OpenRouter']
    capabilities:
      - tools
      - file_search
      - context
      - artifacts
      - actions
      - deferred_tools
  custom:
    - name: 'OpenRouter'
      # OPENROUTER_KEY is read from .env.
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['meta-llama/llama-3.3-70b-instruct']
        # List every model OpenRouter offers in the model picker.
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3.3-70b-instruct'
      # OpenRouter models use different stop tokens, so the stop parameter is dropped.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
