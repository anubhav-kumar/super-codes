# LibreChat configuration (Phase 1): OpenRouter as the only endpoint.
# Reference: librechat.example.yaml and https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.18

cache: true

endpoints:
  custom:
    - name: 'OpenRouter'
      # OPENROUTER_KEY is read from .env.
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['meta-llama/llama-3.3-70b-instruct']
        # List every model OpenRouter offers in the model picker.
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3.3-70b-instruct'
      # OpenRouter models use different stop tokens, so the stop parameter is dropped.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
