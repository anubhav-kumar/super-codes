# Orders service. Orders, order assignments (workers on an order) and order numbering.
# Owns the Orders, OrderAssignments and OrderCounters tables. Reads People and Companies (directory)
# and Workers (workers) by their deterministic names, read-only.
service: ca-crm-orders

frameworkVersion: '3'

custom:
  ordersTable: ca-crm-orders-${sls:stage}-orders
  assignmentsTable: ca-crm-orders-${sls:stage}-order-assignments
  countersTable: ca-crm-orders-${sls:stage}-counters
  peopleTable: ca-crm-directory-${sls:stage}-people
  companiesTable: ca-crm-directory-${sls:stage}-companies
  workersTable: ca-crm-workers-${sls:stage}-workers
  sessionsTable: ca-crm-auth-${sls:stage}-sessions

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'ap-southeast-1'}
  deploymentMethod: direct
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  apiGateway:
    restApiId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiId}
    restApiRootResourceId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiRootResourceId}
  environment:
    ORDERS_TABLE: ${self:custom.ordersTable}
    ASSIGNMENTS_TABLE: ${self:custom.assignmentsTable}
    COUNTERS_TABLE: ${self:custom.countersTable}
    PEOPLE_TABLE: ${self:custom.peopleTable}
    COMPANIES_TABLE: ${self:custom.companiesTable}
    WORKERS_TABLE: ${self:custom.workersTable}
    SESSIONS_TABLE: ${self:custom.sessionsTable}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:ConditionCheckItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.ordersTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.ordersTable}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.assignmentsTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.assignmentsTable}/index/*
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.countersTable}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.peopleTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.companiesTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.workersTable}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.sessionsTable}

package:
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!package-lock.json'

layers:
  common:
    path: ../../libs/common
    name: ${self:service}-${sls:stage}-common
    description: ca-crm common layer (logger, http, errors, middleware, auth, database, validators)
    compatibleRuntimes:
      - nodejs20.x

functions:
  create:
    handler: handlers/create.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: orders
          method: post
          cors: true
  list:
    handler: handlers/list.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: orders
          method: get
          cors: true
  get:
    handler: handlers/get.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: orders/{id}
          method: get
          cors: true
  update:
    handler: handlers/update.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: orders/{id}
          method: put
          cors: true

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.ordersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: entity
            AttributeType: S
          - AttributeName: sortKey
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: clientId
            AttributeType: S
          - AttributeName: receivedFromId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: byDate
            KeySchema:
              - AttributeName: entity
                KeyType: HASH
              - AttributeName: sortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: byStatus
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: sortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: byClient
            KeySchema:
              - AttributeName: clientId
                KeyType: HASH
              - AttributeName: sortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: byReceivedFrom
            KeySchema:
              - AttributeName: receivedFromId
                KeyType: HASH
              - AttributeName: sortKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    OrderAssignmentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.assignmentsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: workerId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
          - AttributeName: workerId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: byWorker
            KeySchema:
              - AttributeName: workerId
                KeyType: HASH
              - AttributeName: orderId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    OrderCountersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.countersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: name
            AttributeType: S
        KeySchema:
          - AttributeName: name
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
