# Auth service. Staff accounts (Users), sessions (Sessions), sign-in and sign-out.
# Owns the Users, Sessions and WorkerLinks tables; every other service reads Sessions and Users
# (requireUser in the common layer) by their deterministic names.
service: ca-crm-auth

frameworkVersion: '3'

custom:
  usersTable: ca-crm-auth-${sls:stage}-users
  sessionsTable: ca-crm-auth-${sls:stage}-sessions
  workerLinksTable: ca-crm-auth-${sls:stage}-worker-links
  workersTable: ca-crm-workers-${sls:stage}-workers

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'ap-southeast-1'}
  deploymentMethod: direct
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  apiGateway:
    restApiId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiId}
    restApiRootResourceId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiRootResourceId}
  environment:
    USERS_TABLE: ${self:custom.usersTable}
    SESSIONS_TABLE: ${self:custom.sessionsTable}
    WORKER_LINKS_TABLE: ${self:custom.workerLinksTable}
    WORKERS_TABLE: ${self:custom.workersTable}
  iam:
    role:
      statements:
        # Scan: named exception for the admin-only Users list and admin count (P-25).
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.usersTable}
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.usersTable}/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.sessionsTable}
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.sessionsTable}/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.workerLinksTable}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.workersTable}

package:
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!package-lock.json'

layers:
  common:
    path: ../../libs/common
    name: ${self:service}-${sls:stage}-common
    description: ca-crm common layer (logger, http, errors, middleware, auth, database, validators)
    compatibleRuntimes:
      - nodejs20.x

functions:
  login:
    handler: handlers/login.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/login
          method: post
          cors: true
  me:
    handler: handlers/me.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/me
          method: get
          cors: true
  logout:
    handler: handlers/logout.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/logout
          method: post
          cors: true
  password:
    handler: handlers/password.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/password
          method: post
          cors: true
  listUsers:
    handler: handlers/users/list.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/users
          method: get
          cors: true

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.usersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        # Only one GSI may be added per table per deploy (CloudFormation limit).
        GlobalSecondaryIndexes:
          - IndexName: byUserId
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    SessionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.sessionsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tokenHash
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: tokenHash
            KeyType: HASH
        # Only one GSI may be added per table per deploy (CloudFormation limit).
        GlobalSecondaryIndexes:
          - IndexName: byUserId
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # One item per linked Worker: makes "a Worker is linked to at most one user" a conditional write.
    WorkerLinksTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.workerLinksTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: workerId
            AttributeType: S
        KeySchema:
          - AttributeName: workerId
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
