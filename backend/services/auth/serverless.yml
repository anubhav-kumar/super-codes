# Auth service. Staff accounts (Users), sessions (Sessions), sign-in and sign-out.
# Owns the Users and Sessions tables; every other service reads Sessions by its deterministic name.
service: ca-crm-auth

frameworkVersion: '3'

custom:
  usersTable: ca-crm-auth-${sls:stage}-users
  sessionsTable: ca-crm-auth-${sls:stage}-sessions

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: ${opt:region, 'ap-southeast-1'}
  deploymentMethod: direct
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  apiGateway:
    restApiId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiId}
    restApiRootResourceId: ${cf:ca-crm-api-gateway-${sls:stage}.RestApiRootResourceId}
  environment:
    USERS_TABLE: ${self:custom.usersTable}
    SESSIONS_TABLE: ${self:custom.sessionsTable}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.usersTable}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.sessionsTable}

package:
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!package-lock.json'

layers:
  common:
    path: ../../libs/common
    name: ${self:service}-${sls:stage}-common
    description: ca-crm common layer (logger, http, errors, middleware, auth, database, validators)
    compatibleRuntimes:
      - nodejs20.x

functions:
  login:
    handler: handlers/login.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/login
          method: post
          cors: true
  me:
    handler: handlers/me.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/me
          method: get
          cors: true
  logout:
    handler: handlers/logout.handler
    layers:
      - { Ref: CommonLambdaLayer }
    events:
      - http:
          path: auth/logout
          method: post
          cors: true

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.usersTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    SessionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.sessionsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: tokenHash
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
